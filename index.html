:root{--bg:#F5F1E8;--fg:#0F0D0A;--mute:#6B5F49;--gold:#B8954A;--line:#DCD2BF;--card:#FBF8F2}

function normc(c){return c.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);});}
window.__u=u;
async function keyFor(code){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
var BIN={}, URLS={};
function getBin(b){ if(!BIN[b]){ BIN[b]=fetch(b).then(function(r){ if(!r.ok) throw new Error('http'+r.status); return r.arrayBuffer(); }); BIN[b].catch(function(){ delete BIN[b]; }); } return BIN[b]; }
window.__dec=function(p){
  if(URLS[p]) return URLS[p]; var m=(window.__MANIFEST||{})[p]; if(!m) return Promise.reject(new Error('absent'));
  URLS[p]=getBin(m[0]).then(function(buf){ var ct=m.length>5?buf.slice(m[4],m[4]+m[5]):buf; return crypto.subtle.decrypt({name:'AES-GCM',iv:u(m[1])},window.__KEY,ct); })

  URLS[p].catch(function(){ delete URLS[p]; }); return URLS[p];
};
async function go(code,remember){

  var man=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.mi)},k,u(D.m))));
  if(remember){try{localStorage.setItem('carre-code',code);}catch(e){}}

  html=html.replace(/f\/[0-9a-f]{32}\.(?:jpg|jpeg|png|mp4|webp|gif)/g,function(p){ return (/\.mp4$/.test(p)?'vid:':'enc:')+p; });
  html=html.replace(/src="enc:(f\/[0-9a-f]{32}\.(?:jpg|jpeg|png|webp|gif))"/g,'src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" data-encimg="$1"');
