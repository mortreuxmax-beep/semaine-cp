:root{--bg:#F5F1E8;--fg:#0F0D0A;--mute:#6B5F49;--gold:#B8954A;--line:#DCD2BF;--card:#FBF8F2}

function normc(c){return c.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);});}
window.__u=u;
async function keyFor(code){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function go(code,remember){
  var b=document.getElementById('b');
  var k=await keyFor(code);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
  var man=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.mi)},k,u(D.m))));
  if(remember){try{localStorage.setItem('carre-code',code);}catch(e){}}
  window.__KEY=k; window.__MANIFEST=man; window.__FILES={};
  var paths=Object.keys(man).filter(function(p){return man[p][2].indexOf('video/')!==0;});
  var n=0; b.textContent='Ouverture… 0/'+paths.length;
  var urls={};
  await Promise.all(paths.map(async function(p){
    var m=man[p]; var r=await fetch(m[0]); var ct=await r.arrayBuffer();
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(m[1])},k,ct);
    var f=new File([pt],m[3],{type:m[2]}); var url=URL.createObjectURL(f); urls[p]=url; window.__FILES[url]=f;
    n++; b.textContent='Ouverture… '+n+'/'+paths.length;
  }));
  html=html.replace(/f\/[0-9a-f]{32}\.(?:jpg|jpeg|png|mp4|webp|gif)/g,function(p){ return urls[p]||(/\.mp4$/.test(p)?'vid:'+p:p); });
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();var b=document.getElementById('b'),e=document.getElementById('e');
  b.disabled=true;b.textContent='Ouverture…';e.textContent='';
  go(normc(document.getElementById('c').value),true).catch(function(){e.textContent='Code incorrect, ou connexion interrompue. Réessayez.';b.disabled=false;b.textContent='Ouvrir';});
});
(function(){var c=null;try{c=localStorage.getItem('carre-code');}catch(e){} if(c){document.getElementById('b').disabled=true; go(c,false).catch(function(){try{localStorage.removeItem('carre-code');}catch(e){} var b=document.getElementById('b'); b.disabled=false; b.textContent='Ouvrir';});}})();
